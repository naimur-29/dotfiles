bind R source-file ~/.tmux.conf

# Create a new window in the current pane's directory
bind c new-window -c "#{pane_current_path}"

# Create a horizontal split pane in the current pane's directory
unbind %
bind "'" split-window -h -c "#{pane_current_path}"

# Bind Prefix + " to horizontal split (top/bottom)
bind '"' split-window -v

# Bind Prefix + ' to vertical split (side-by-side)
bind "'" split-window -h

# Create a vertical split pane in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"

set -g prefix C-Space

set -g default-shell "/usr/bin/zsh"

set -g mouse on
set -g default-shell "/usr/bin/zsh"

set -g mouse on

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# start index at 1
set -g base-index 1
set -g pane-base-index 1

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-cpu'
# in .tmux.conf
# set -g status-right '#{cpu_bg_color} CPU: #{cpu_icon} #{cpu_percentage}'
# set -g @plugin 'tmux-plugins/tmux-battery'

set -g @plugin 'catppuccin/tmux#v2.1.3'
# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
# Make the status line pretty and add some modules
set -g status-right-length 1
set -g status-left-length 100
# set -g status-left ""
# set -ag status-left "#{E:@catppuccin_status_uptime}"
# set -ag status-left "#{E:@catppuccin_status_session}"

set -g status-right ""
